services:
  share-web:
    container_name: share-web
    build:
      context: .
      dockerfile: ./apps/share-web/Dockerfile
    restart: always
    ports:
      - 4000:8080
    environment:
      - STATIC_ENABLED=true
      - STATIC_RULES=*,^/trpc/(.*),http://share-api:4001/trpc/$1;*,^/media/(.*),http://share-api:4001/media/$1;*,^/auth/(.*),http://share-api:4001/auth/$1
    depends_on:
      - share-api

  share-api:
    container_name: share-api
    build:
      context: .
      dockerfile: ./apps/share-api/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=file:/var/lib/photo-library/photo-library.db
      - SQLITE_BUSY_TIMEOUT_MS=5000
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT}
      - RUSTFS_REGION=us-east-1
      - RUSTFS_BUCKET=photo-library
      - RUSTFS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY_ID}
      - RUSTFS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_ACCESS_KEY}
      - RUSTFS_PRESIGN_SECONDS=${RUSTFS_PRESIGN_SECONDS:-300}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - OIDC_ALLOWED_SUBJECTS=${OIDC_ALLOWED_SUBJECTS}
      - OIDC_ALLOWED_GROUPS=${OIDC_ALLOWED_GROUPS}
      - OIDC_COOKIE_SECURE=true
    volumes:
      - photo-library-db:/var/lib/photo-library
      - photo-library-cache:/app/data/cache
      - photo-library-tmp:/app/data/tmp
    depends_on:
      rustfs:
        condition: service_started

  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:latest
    restart: always
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_ACCESS_KEY}
    volumes:
      - rustfs-data:/data

volumes:
  photo-library-db: {}
  photo-library-cache: {}
  photo-library-tmp: {}
  rustfs-data: {}
