services:
  share:
    build:
      context: .
      dockerfile: ./apps/share/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres?schema=public
    depends_on:
      db:
        condition: service_started
      prisma-migrate:
          condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  service-thumbnail:
    build:
      context: .
      dockerfile: ./services/thumbnail/Dockerfile
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres?schema=public
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      prisma-migrate:
          condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  service-share-bot:
    build:
      context: .
      dockerfile: ./services/share-bot/Dockerfile
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres?schema=public
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      prisma-migrate:
          condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M


  prisma-migrate:
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres?schema=public
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  db:
    image: postgres:17.4-alpine3.21
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

volumes:
  postgres-data: {}
