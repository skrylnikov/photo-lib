name: validate-and-publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: 12.0.0-rc.8}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter share-api test
      - run: pnpm --filter share-web test

  image:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: apps/share-api/Dockerfile
          - name: web
            file: apps/share-web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable image tag
        id: image
        shell: bash
        run: echo "tag=main-$(git show -s --format=%ct HEAD)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/skrylnikov/photo-lib-${{ matrix.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=photo-lib-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=photo-lib-${{ matrix.name }}
